# =============================================================================
#  rock-n-roll-pw-out — envoi du son du PC vers la Raspberry Pi (RTP)
#  Emplacement actif : ~/.config/rock-n-roll-pw-out/pw-out.conf
#  (écrit par install.sh ; ses options --host, --port… modifient ce fichier)
#
#  Après modification : rock-n-roll-pw-out apply
#  État               : rock-n-roll-pw-out status
# =============================================================================

[rtp]
# Nom ou adresse de la Pi. Le nom est résolu à chaque démarrage de session :
# un changement d'adresse de la Pi est suivi automatiquement.
host = hifi.local
# Port UDP : celui de rock-n-roll-pw-in sur la Pi
port = 46000
# Format : DOIT être identique à celui de la Pi (pw-in.conf)
rate = 192000
format = S24BE
channels = 2
# Durée d'un paquet (ms). 1 ms à 192 kHz / 24 bits = 1152 octets : tient dans un
# paquet réseau (1280 octets max), sans fragmentation.
ptime-ms = 1
# Tampon d'envoi (ms) : multiple de ptime-ms
latency-ms = 10
# Garder la place sur la Pi même quand rien ne joue (envoi de silence) :
#   no  = la place se libère quelques secondes après la fin du son (défaut)
#   yes = ce PC garde la Pi tant que la session est ouverte
hold = no
# Journal de l'émetteur (journalctl --user -u rock-n-roll-out) : 2 = avertissements ;
# 3 = aussi resynchronisations et échantillons sautés (diagnostic des coupures)
log-level = 2
# Nom de la sortie dans les réglages du son
description = Hifi — réseau (RTP 192 kHz)

[pc]
# Fréquences que PipeWire peut adopter (le son n'est rééchantillonné que si besoin)
allowed-rates = 44100 48000 88200 96000 176400 192000
